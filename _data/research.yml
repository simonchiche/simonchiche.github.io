# Contenu de Research, en anglais comme le reste du site.
# Remplacez les textes provisoires dans "description", "introduction" et
# "conclusion". Ces champs acceptent le Markdown : **gras**, *italique*, liens.
# "image_side" indique le côté de l'image : left ou right.
# "image_alt" décrit la figure ; "image_caption" est une légende facultative.
# Les chemins d'images commencent par /images/.

# Titres 1 et 2 : un paragraphe accompagné d'une image.
overview:
  - id: powerful-sources
    title: "Probing the high-energy Universe"
    description: |
      What are the most powerful sources in the Universe?
      Over the past decades, astronomers have witnessed some of the most violent
      phenomena in the cosmos, from gamma-ray bursts and neutron star mergers
      to flares from supermassive black holes. These extreme environments may
      be capable of accelerating cosmic rays, high-energy atomic nuclei that
      travel through space at near the speed of light. These particles can be
      detected through the particle cascades they induce when interacting with
      Earth's atmosphere. Yet, more than 50 years after the first detection of
      ultra-high-energy cosmic rays (E &gt; 10<sup>18</sup> eV), the sources of these
      particles and their acceleration mechanisms at the highest energies
      remain largely unknown.
    image: /images/research/CosmicRays.jpg
    image_alt: "Cosmic rays producing particle cascades in Earth's atmosphere."
    image_side: left
    image_caption: "Caption to be added. Credit: source to be added."

  - id: multi-messenger
    title: "A multi-messenger experience"
    description: |
      One of the main challenges in identifying cosmic-ray sources is that these
      particles are electrically charged. As such, they are deflected by Galactic
      and extragalactic magnetic fields, making it difficult to trace them back
      to their origins. However, ultra-high-energy cosmic rays can also interact
      with surrounding matter and radiation near their sources, or with background
      light during their propagation, producing neutral secondary particles such
      as neutrinos and gamma rays. Unlike cosmic rays, ultra-high-energy neutrinos
      (E &gt; 10<sup>17</sup> eV) can travel across cosmological distances in a
      straight line with negligible attenuation. Combining observations of cosmic
      rays with those of other cosmic messengers, such as neutrinos, gamma rays
      and gravitational waves, therefore offers a powerful way to investigate
      cosmic ray origin.
    image: /images/research/MM.png
    image_alt: "Gamma rays, neutrinos, cosmic rays and gravitational waves travelling from a cosmic source to Earth."
    image_side: right
    image_caption: ""

# Titre 3 : introduction sur toute la largeur, deux expériences, puis conclusion.
# L'introduction et la conclusion occupent toute la largeur disponible.
neutrinos:
  title: "Detecting ultra-high energy neutrinos"
  introduction: |
  
    Detecting ultra-high-energy neutrinos is a major experimental challenge due to their extremely low expected flux and their very small interaction cross-section. So far, only one ultra-high-energy neutrino candidate has been detected by the KM3NeT Collaboration. This motivates the development of new large-scale experiments to detect these particles with unprecedented sensitivity. Radio detection of astroparticles stands out as a particularly promising technique, as it allows vast detection volumes to be monitored using sparse arrays of antennas at relatively low cost.
  experiments:
    - id: grand
      title: "GRAND: The Giant Radio for Neutrino Detection"
      description: |
        GRAND (Giant Radio Array for Neutrino Detection) is a planned large-scale
        radio experiment that aims to detect ultra-high-energy neutrinos by
        deploying 200,000 antennas over 200,000 square kilometers, across
        radio-quiet sites in favorable mountainous regions around the world.
        To do so, GRAND will primarily target tau neutrinos arriving at Earth
        along nearly horizontal trajectories. These neutrinos can interact
        within mountains or beneath the Earth's surface, producing tau leptons
        that may emerge into the atmosphere and induce extensive air showers
        emitting a radio emission detectable on Earth.

        Thanks to its innovative design, GRAND is expected to achieve, in its
        final configuration, an unprecedented neutrino sensitivity of
        $\sim 10^{-10}\,\mathrm{GeV\,cm^{-2}\,s^{-1}\,sr^{-1}}$ above
        $5 \times 10^{17}\,\mathrm{eV}$, together with sub-degree angular
        resolution and full-sky coverage over time. To date, a total of
        $\mathcal{O}(80)$ antennas have been deployed, with prototype arrays
        located in Dunhuang (China), Malargüe (Argentina), and Nançay (France).

      image: /images/research/GRAND.png
      image_alt: "Diagram of the GRAND detection principle, showing particle showers above a radio antenna array in mountainous terrain."
      image_side: left
      image_caption: ""

    - id: rno-g
      title: "RNO-G: The Radio Neutrino Observatory in Greenland"
      description: |
        RNO-G is a large-scale in-ice radio observatory designed to detect
        ultra-high-energy neutrinos using antennas deployed in the Greenland
        ice sheet near Summit Station. The array will consist of 35 stations,
        each equipped with 24 antennas, combining deep in-ice antennas for
        neutrino detection with surface antennas to identify and veto cosmic-ray
        events. RNO-G aims to detect the Askaryan radio emission produced by
        particle cascades induced by neutrino interactions in the ice.

        Once completed, RNO-G is expected to achieve a five-year sensitivity of
        approximately $E^{2}\Phi_{\nu} \sim 10^{-8}\,\mathrm{GeV\,cm^{-2}\,s^{-1}\,sr^{-1}}$
        to the all-flavor diffuse neutrino flux, with an instantaneous field of
        view covering roughly one-third of the sky. This would make it the most
        sensitive experiment for ultra-high-energy neutrinos at the time of its
        completion. To date, 12 stations have been deployed and are fully
        operational.
      image: /images/research/RNOGdetection_sketch.png
      image_alt: "Sketch of the RNO-G detection principle, showing in-ice radio antennas and radio emission from a neutrino interaction."
      image_side: right
      image_caption: ""

  conclusion: |
    Beyond GRAND and RNO-G, several other experiments are targeting
    ultra-high-energy neutrinos using complementary detection techniques,
    including the Radar Echo Telescope (RET), the Hybrid Elevated Radio
    Observatory for Neutrinos (HERON), and the Payload for Ultrahigh Energy
    Observations (PUEO). Together, these efforts make it likely that a new
    astronomical window will open within the next decade. Integrating
    ultra-high-energy neutrinos into multi-messenger astronomy will therefore
    offer unprecedented opportunities for major breakthroughs in our
    understanding of the high-energy Universe, providing insights into the
    sources of cosmic rays at the highest energies.

# Titre 4 : trois sous-sections, chacune contenant ses blocs texte/figure.
# Dans chaque bloc, remplacez description, image, image_alt et image_caption.
# "publication" contient le titre, les auteurs (dans l'ordre), la revue,
# la référence bibliographique et le lien affiché sous le texte.
projects_title: "My research projects"
projects_introduction: "The ultimate goal of my research is to help develop the next generation of detectors, connect observations with astrophysical models, and integrate ultra-high-energy neutrinos into multi-messenger astronomy. Below, I highlight some of my research projects contributing to this goal.
"
projects:
  - id: physical-processes
    title: "Modelling and interpretation of physical processes"
    blocks:
      # Premier bloc : figure à gauche, texte à droite.
      - description: |
          In this work, we modelled the radio emission from very inclined
          cosmic-ray air showers, which propagate through the atmosphere along
          nearly horizontal trajectories and are primary targets for
          next-generation radio experiments such as GRAND. We showed that these
          showers develop in a lower-density atmosphere than more vertical
          showers, leading to larger deflections of charged particles. As a
          result, we predicted the emergence of synchrotron-like emission and
          coherence-loss effects in very inclined showers, which were
          subsequently confirmed through Monte Carlo simulations of the radio
          signal. Finally, we discussed the implications of these effects for
          the development of future radio detectors, particularly regarding the
          discrimination between neutrino- and cosmic-ray-induced air showers.
        image: /images/research/Coherence.png
        image_alt: "Ratios of characteristic emission lengths versus air density and zenith angle, highlighting incoherent and synchrotron contributions."
        image_side: left
        image_caption: "Caption to be added."
        publication:
          title: >-
            Loss of Coherence and Change in Emission Physics for Radio Emission
            from Very Inclined Cosmic-Ray Air Showers
          authors:
            - "Simon Chiche"
            - "Chao Zhang"
            - "Felix Schlüter"
            - "Kumiko Kotera"
            - "Tim Huege"
            - "Krijn D. de Vries"
            - "Matias Tueros"
            - "Marion Guelfand"
          journal: "Physical Review Letters"
          reference: "132, 231001 (2024)"
          url: "https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.132.231001"

      # Deuxième bloc : texte à gauche, figure à droite.
      - description: |
          To detect ultra-high-energy neutrinos, experiments such as RNO-G
          deploy radio antennas deep in the Greenland ice sheet to detect the
          radio emission produced by neutrino-induced particle cascades. In
          this context, characterizing the radio emission from cosmic rays is
          essential, as these particles provide both a valuable calibration
          source and a major background in neutrino searches. Using the FAERIE
          Monte Carlo code, we developed one of the first simulation libraries
          describing the radio emission from cosmic-ray showers propagating
          into the ice. We investigated the signatures of these signals in
          terms of amplitude, frequency content, and polarization. Based on
          these results, we established key guidelines for identifying the
          first cosmic-ray events with RNO-G and distinguishing them from
          neutrino-induced events.
        image: /images/research/IceSignatures.png
        image_alt: "Ratio of in-air to in-ice radio energy versus zenith angle at a depth of 100 m, for three primary energies."
        image_side: right
        image_caption: "Caption to be added."
        publication:
          title: "In-ice radio signatures of cosmic ray particle cascades"
          authors:
            - "Simon Chiche"
            - "Simona Toscano"
            - "Krijn D. de Vries"
          journal: "Astroparticle Physics"
          reference: "182, 103276 (2026)"
          url: "https://www.sciencedirect.com/science/article/pii/S0927650526000733"

  - id: simulation-tools
    title: "Innovative tools for efficient simulations"
    blocks:
      # Premier bloc : figure à gauche, texte à droite.
      - description: |
          The development of large-scale radio detectors requires both fast
          and accurate simulations of the radio emission from particle showers.
          In this context, we developed a new version of Radio Morphing, a
          semi-analytical code that efficiently predicts the radio emission
          from inclined cosmic-ray air showers at arbitrary positions in space,
          using a limited set of reference simulations. To achieve this, we
          combined reference simulations with newly developed scaling laws
          describing the shower physics and an interpolation algorithm. Radio
          Morphing can reproduce the radio signal amplitude with a relative
          accuracy of approximately 10–15%, while reducing the computation time
          by more than four orders of magnitude compared to standard Monte
          Carlo simulations.
        image: /images/research/RM.png
        image_alt: "Reconstruction uncertainty versus target zenith angle for three frequency bands, with reconstruction bias shown in the upper panel."
        image_side: left
        image_caption: "Caption to be added."
        publication:
          title: "Radio morphing: Fast computation of inclined air shower radio emission"
          authors:
            - "Simon Chiche"
            - "Olivier Martineau-Huynh"
            - "Matias Tueros"
            - "Krijn D. de Vries"
          journal: "Astroparticle Physics"
          reference: "184, 103291 (2027)"
          url: "https://www.sciencedirect.com/science/article/pii/S0927650526000885"

      # Deuxième bloc : texte à gauche, figure à droite.
      - description: |
          For in-ice neutrino detectors such as ARA and RNO-G,
          cosmic-ray-induced radio emission constitutes both a major background
          and a valuable calibration source. Accurate modeling of this emission
          relies on computationally expensive Monte Carlo simulations, such as
          FAERIE, limiting the exploration of the full parameter space. In this
          work, we present a semi-analytical parameterization of the in-ice
          radio emission from cosmic-ray showers, combining a dense library of
          FAERIE simulations with scaling laws describing the dependence of the
          signal on shower parameters. This approach provides order-of-magnitude
          estimates of the radio signal within seconds, enabling the generation
          of large simulation datasets for in-ice neutrino experiments. Finally,
          we explore the potential for cosmic-ray mass composition
          reconstruction using specific features of their in-ice radio emission.
        image: /images/research/FAERIEParam.png
        image_alt: "Simulated in-ice radio energy normalized by primary energy squared, for three primary energies, compared with an exponential parametrization."
        image_side: right
        image_caption: "Caption to be added."
        publication:
          title: >-
            Semi-analytical parametrization of in-ice radio signals from cosmic
            ray particle cascades
          authors:
            - "Simon Chiche"
            - "Simona Toscano"
            - "Krijn D. de Vries"
          journal: "Proceedings of Science"
          reference: "ARENA2026, 025 (2026)"
          url: "https://pos.sissa.it/538/025/pdf"

  - id: data-analysis
    title: "Data analysis and reconstruction of astrophysical signatures."
    blocks:
      # Un seul bloc : figure à gauche, texte à droite.
      - description: |
          The development of large-scale radio experiments requires autonomous
          radio detection, relying exclusively on antennas to identify particle
          showers. This involves distinguishing radio signals from particle
          showers against various sources of background noise. We showed that,
          for inclined cosmic-ray air showers, the polarization of the radio
          signal is nearly perpendicular to the Earth's magnetic field,
          providing a powerful discriminating observable. Using Monte Carlo
          simulations of the radio emission, together with realistic models of
          the detector response and radio environment, we demonstrated that
          this method could reject up to ~93% of the background while retaining
          ~90% of cosmic-ray events. Finally, we showed that radio polarization
          also provides a key observable for distinguishing neutrino-induced
          from cosmic-ray-induced air showers.
        image: /images/research/Polar.png
        image_alt: "Antenna counts as a function of total electric-field amplitude Etot and the field ratio Eb/Etot."
        image_side: left
        image_caption: "Caption to be added."
        publication:
          title: >-
            Polarisation signatures in radio for inclined cosmic-ray induced
            air-shower identification
          authors:
            - "Simon Chiche"
            - "Kumiko Kotera"
            - "Olivier Martineau-Huynh"
            - "Matias Tueros"
            - "Krijn D. de Vries"
          journal: "Astroparticle Physics"
          reference: "139, 102696 (2022)"
          url: "https://www.sciencedirect.com/science/article/pii/S0927650522000111"
