# Titres 1 et 2 : un paragraphe accompagné d'une image.
overview:
  - id: powerful-sources
    title: "Probing the high-energy Universe"
    description: |
      What are the most powerful sources in the Universe?
      Over the past decades, astronomers have witnessed some of the most violent
      phenomena in the cosmos, from gamma-ray bursts and neutron star mergers
      to flares from supermassive black holes. These extreme environments may
      be capable of accelerating cosmic rays, high-energy atomic nuclei that
      travel through space at near the speed of light. These particles can be
      detected through the particle cascades they induce when interacting with
      Earth's atmosphere. Yet, more than 50 years after the first detection of
      ultra-high-energy cosmic rays (E &gt; 10<sup>18</sup> eV), the sources of these
      particles and their acceleration mechanisms at the highest energies
      remain largely unknown.
    image: /images/research/CosmicRays.jpg
    image_alt: "Cosmic rays producing particle cascades in Earth's atmosphere."
    image_side: left
    image_caption: "Caption to be added. Credit: source to be added."

  - id: multi-messenger
    title: "A multi-messenger experience"
    description: |
      One of the main challenges in identifying cosmic-ray sources is that these
      particles are electrically charged. As such, they are deflected by Galactic
      and extragalactic magnetic fields, making it difficult to trace them back
      to their origins. However, ultra-high-energy cosmic rays can also interact
      with surrounding matter and radiation near their sources, or with background
      light during their propagation, producing neutral secondary particles such
      as neutrinos and gamma rays. Unlike cosmic rays, ultra-high-energy neutrinos
      (E &gt; 10<sup>17</sup> eV) can travel across cosmological distances in a
      straight line with negligible attenuation. Combining observations of cosmic
      rays with those of other cosmic messengers, such as neutrinos, gamma rays
      and gravitational waves, therefore offers a powerful way to investigate
      cosmic ray origin.
    image: /images/research/MM.png
    image_alt: "Gamma rays, neutrinos, cosmic rays and gravitational waves travelling from a cosmic source to Earth."
    image_side: right
    image_caption: ""

# Titre 3 : introduction sur toute la largeur, deux expériences, puis conclusion.
# La conclusion est répartie en deux colonnes qui s'équilibrent automatiquement.
neutrinos:
  title: "Detecting ultra-high energy neutrinos"
  introduction: |
  
    Detecting ultra-high-energy neutrinos is a major experimental challenge due to their extremely low expected flux and their very small interaction cross-section. So far, only one ultra-high-energy neutrino candidate has been detected by the KM3NeT Collaboration. This motivates the development of new large-scale experiments to detect these particles with unprecedented sensitivity. Radio detection of astroparticles stands out as a particularly promising technique, as it allows vast detection volumes to be monitored using sparse arrays of antennas at relatively low cost.
  experiments:
    - id: grand
      title: "GRAND: The Giant Radio for Neutrino Detection"
      description: |
        GRAND (Giant Radio Array for Neutrino Detection) is a planned large-scale
        radio experiment that aims to detect ultra-high-energy neutrinos by
        deploying 200,000 antennas over 200,000 square kilometers, across
        radio-quiet sites in favorable mountainous regions around the world.
        To do so, GRAND will primarily target tau neutrinos arriving at Earth
        along nearly horizontal trajectories. These neutrinos can interact
        within mountains or beneath the Earth's surface, producing tau leptons
        that may emerge into the atmosphere and induce extensive air showers
        emitting a radio emission detectable on Earth.

        Thanks to its innovative design, GRAND is expected to achieve, in its
        final configuration, an unprecedented neutrino sensitivity of
        $\sim 10^{-10}\,\mathrm{GeV\,cm^{-2}\,s^{-1}\,sr^{-1}}$ above
        $5 \times 10^{17}\,\mathrm{eV}$, together with sub-degree angular
        resolution and full-sky coverage over time. To date, a total of
        $\mathcal{O}(80)$ antennas have been deployed, with prototype arrays
        located in Dunhuang (China), Malargüe (Argentina), and Nançay (France).

      image: /images/research/GRAND.png
      image_alt: "Diagram of the GRAND detection principle, showing particle showers above a radio antenna array in mountainous terrain."
      image_side: left
      image_caption: ""

