<div class="research-block research-block--image-{{ include.block.image_side | default: 'left' | escape }}">
  <div class="research-block__text">
    {{ include.block.description | markdownify }}
  </div>
  <figure class="research-block__figure">
    <img src="{{ include.block.image | relative_url }}" alt="{{ include.block.image_alt | default: include.block.title | escape }}" loading="lazy" decoding="async">
    {% if include.block.image_caption and include.block.image_caption != empty %}
      <figcaption>{{ include.block.image_caption | markdownify }}</figcaption>
    {% endif %}
  </figure>
</div>
